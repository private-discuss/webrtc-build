name: build

# Private Discuss fork: builds only the two packages @livekit/react-native-webrtc consumes
# (LiveKitWebRTC.xcframework, android_prefixed aar), with build/patches/raw_frame_key.patch,
# on GitHub-hosted runners. Runs on a tag push (release created) or by hand.

on:
  workflow_dispatch:
    inputs:
      commitHash:
        description: 'webrtc-sdk commit hash (empty = build/VERSION)'
        default: ''
        required: false
      configuration:
        description: 'build configuration'
        default: 'release'
        required: true
        type: choice
        options:
          - release
          - debug
  push:
    tags:
      - '*'

permissions:
  contents: write
  actions: read

jobs:
  build-apple:
    defaults:
      run:
        working-directory: ./build
    strategy:
      fail-fast: false
      matrix:
        name:
          - apple_prefixed
    runs-on: macos-26
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v5
    - name: Select Xcode 26.0
      run: sudo xcode-select --switch /Applications/Xcode_26.0.app/Contents/Developer
    - name: Build
      id: build
      run: ./build.${{ matrix.name }}.sh "${{ github.event.inputs.commitHash }}" "${{ github.event.inputs.configuration || 'release' }}"
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.build.outputs.framework_name }}.xcframework.zip
        path: build/_package/${{ matrix.name }}/${{ steps.build.outputs.framework_name }}.xcframework.zip
  build-linux:
    defaults:
      run:
        working-directory: ./build
    strategy:
      fail-fast: false
      matrix:
        name:
          - android_prefixed
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v4
    # The WebRTC Android checkout + 4-arch build needs ~45 GB: drop the runner's preinstalled tools.
    - name: Free disk space
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true
    - run: df -h /
    - run: ./build.${{ matrix.name }}.sh "${{ github.event.inputs.commitHash }}"
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: webrtc.${{ matrix.name }}.tar.gz
        path: build/_package/${{ matrix.name }}/webrtc.tar.gz
  create-release:
    name: Create Release
    if: github.ref_type == 'tag'
    needs:
      - build-apple
      - build-linux
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
        name: webrtc.android_prefixed.tar.gz
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
        name: LiveKitWebRTC.xcframework.zip
    - name: Extract the Android aar and checksums
      run: |
        set -e
        mkdir -p aar && tar -xzf artifacts/webrtc.tar.gz -C aar
        AAR=$(find aar -name libwebrtc.aar | head -1)
        cp "$AAR" "artifacts/android-prefixed-${GITHUB_REF_NAME}.aar"
        (cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
    - uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: artifacts/**
