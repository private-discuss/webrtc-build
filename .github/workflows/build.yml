name: build

# Private Discuss fork: builds only the two packages @livekit/react-native-webrtc consumes
# (LiveKitWebRTC.xcframework, android_prefixed aar), with build/patches/raw_frame_key.patch,
# on GitHub-hosted runners. Runs on a tag push (release created) or by hand.

on:
  workflow_dispatch:
    inputs:
      commitHash:
        description: 'webrtc-sdk commit hash (empty = build/VERSION)'
        default: ''
        required: false
      configuration:
        description: 'build configuration'
        default: 'release'
        required: true
        type: choice
        options:
          - release
          - debug
  push:
    tags:
      - '*'

permissions:
  contents: write
  actions: read

jobs:
  build-apple:
    defaults:
      run:
        working-directory: ./build
    strategy:
      fail-fast: false
      matrix:
        name:
          - apple_prefixed
    runs-on: macos-26
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v5
    - name: Select Xcode 26.0
      run: sudo xcode-select --switch /Applications/Xcode_26.0.app/Contents/Developer
    - name: Build
      id: build
      run: ./build.${{ matrix.name }}.sh "${{ github.event.inputs.commitHash }}" "${{ github.event.inputs.configuration || 'release' }}"
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.build.outputs.framework_name }}.xcframework.zip
        path: build/_package/${{ matrix.name }}/${{ steps.build.outputs.framework_name }}.xcframework.zip
  build-linux:
    defaults:
      run:
        working-directory: ./build
    strategy:
      fail-fast: false
      matrix:
        name:
          - android_prefixed
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v4
    # The WebRTC Android checkout + 4-arch build needs ~45 GB: drop the runner's preinstalled tools.
    - name: Free disk space
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true
    - run: df -h /
    - run: ./build.${{ matrix.name }}.sh "${{ github.event.inputs.commitHash }}"
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: webrtc.${{ matrix.name }}.tar.gz
        path: build/_package/${{ matrix.name }}/webrtc.tar.gz
  create-release:
    name: Create Release
    if: github.ref_type == 'tag'
    needs:
      - build-apple
      - build-linux
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
        name: webrtc.android_prefixed.tar.gz
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
        name: LiveKitWebRTC.xcframework.zip
    # The raw libwebrtc.aar has prefixed JNI symbols but Java classes still in org.webrtc:
    # LiveKit's webrtc-sdk/android repo shadow-relocates them to livekit.org.webrtc and renames
    # the .so (liblkjingle_peerconnection_so). Same recipe here, at the matching tag, so the
    # asset is a drop-in for io.github.webrtc-sdk:android-prefixed.
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Package android-prefixed (webrtc-sdk/android recipe)
      run: |
        set -e
        mkdir -p aar && tar -xzf artifacts/webrtc.tar.gz -C aar
        AAR=$(find aar -name libwebrtc.aar | head -1)
        . build/VERSION
        git clone -q --branch "v${WEBRTC_VERSION}" --depth 1 https://github.com/webrtc-sdk/android.git lkandroid
        cd lkandroid
        unzip -o -q "../$AAR" -d prefix/
        mkdir -p android-prefixed/shadow/libs android-prefixed/src/main/jniLibs
        mv prefix/classes.jar android-prefixed/shadow/libs/
        python3 tools/downgrade_class_version.py android-prefixed/shadow/libs/classes.jar
        for a in armeabi-v7a arm64-v8a x86 x86_64; do
          mkdir -p "android-prefixed/src/main/jniLibs/$a"
          mv "prefix/jni/$a/libjingle_peerconnection_so.so" "android-prefixed/src/main/jniLibs/$a/liblkjingle_peerconnection_so.so"
        done
        # Gradle 7.2 cannot run on JDK 17; 7.4.2 can and AGP 7.1.3 accepts it.
        sed -i 's#gradle-7.2-bin.zip#gradle-7.4.2-bin.zip#' gradle/wrapper/gradle-wrapper.properties
        ./gradlew --no-daemon -q :android-prefixed:assembleRelease
        cp android-prefixed/build/outputs/aar/android-prefixed-release.aar "../artifacts/android-prefixed-${GITHUB_REF_NAME}.aar"
        cd .. && (cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
    - uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: artifacts/**
